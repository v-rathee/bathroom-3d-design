  </g>
      <path d="M29 48A29 29 0 0 0 0 19" fill="none" stroke="#9f773e" stroke-dasharray="1.2 1" stroke-width=".5"/>
    <path data-door-key="toilet" data-door-state="open" data-door-direction="inward" data-door-hinge="left" data-door-angle="90" d="M0 48L0 19" stroke="#9f773e" stroke-width="1.2"/>
      <path d="M67 48A29 29 0 0 1 96 19" fill="none" stroke="#9f773e" stroke-dasharray="1.2 1" stroke-width=".5"/>
    <path data-door-key="bathroom" data-door-state="open" data-door-direction="inward" data-door-hinge="right" data-door-angle="90" d="M96 48L96 19" stroke="#9f773e" stroke-width="1.2"/>
      <text x="0" y="77" font-size="2.5" fill="#6d7f68">Current fixture sizes illustrative; both doors open inward.</text><g fill="none" stroke="#50675f" stroke-width=".35">
