<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 138 112" role="img" aria-label="Current separate toilet and bathroom: measured room reconstruction">
    <title>Current separate toilet and bathroom: measured room reconstruction</title><desc>35-inch toilet and 55.5-inch bath with a 5.5-inch dividing wall. Fixture sizes assumed. Full door sweep must be checked, not only the fully open position.</desc>
