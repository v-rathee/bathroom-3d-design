    <marker id="separate-current-arrow" markerWidth="5" markerHeight="5" refX="2.5" refY="2.5" orient="auto-start-reverse"><path d="M5 0L0 2.5L5 5" fill="none" stroke="#50675f" stroke-width=".7"/></marker></defs>
    <rect x="-20" y="-20" width="138" height="112" fill="#faf8f1"/>
    <g font-family="Arial,sans-serif" fill="#263e35" font-size="3">
    <rect width="96" height="48" fill="url(#separate-current-tiles)"/>
    <rect data-partition="retained" x="35" y="0" width="5.5" height="48" fill="#b6ae9b" stroke="#6b7364" stroke-width=".4"/>
      <path d="M0 48V0H96V48M29 48H67" fill="none" stroke="#344b41" stroke-width="1.5"/>
      
      <g data-item="squat-pan">
